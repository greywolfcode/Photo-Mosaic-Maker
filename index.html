<!DOCTYPE html>

<html lang="en">
<head>
	<title>Photo Mosaic Maker</title>
    <script type="module" src="scripts/main.js" defer></script>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="container">
    <div class="header">
        Photo mosaic creation tool that runs entierly client-side.
    </div>
    <div class="sidebar" id="sidebar-left">
        <input type="file" name="files[]" id="imageInput" multiple />
        <div id="sidebar-left-content"></div>
    </div>
    <canvas id="grid" width=1080 height="720"></canvas>
    <canvas id="display" width=1080 height="720"></canvas>
    <div class="sidebar" id="sidebar-right">
        <input type="file" id="fileInput" />

        <input type="range" min="1" max="100" value="1" id="x-slider">
        <input type="range" min="1" max="100" value="1" id="y-slider">

        <br>

        <button type="button" id="generate-button">Generate</button>
    </div>
    <dialog id="creating_dialog"  closedby="none">
        <details>
            <summary>Creating mosaic...</summary>
            <div id="dialog_info"></div>
        </details>
    </dialog>
</body>
